name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.lock.txt
          python -m pip install --no-deps --editable .

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest with coverage gate
        env:
          PYTHONHASHSEED: "0"
        run: >-
          pytest -q
          --cov=operatorforge
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Demo smoke and determinism
        env:
          PYTHONHASHSEED: "0"
        run: python examples/run_demo.py

      - name: Scan repository for credential values
        shell: bash
        run: |
          if grep -rE --binary-files=without-match \
            --exclude-dir=.git \
            --exclude-dir=.venv \
            --exclude='*.pyc' \
            '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .; then
            echo "Credential-like value detected"
            exit 1
          fi
